name: Deploy North Star Bakery to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload North Star Bakery site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./north-star-bakery

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
